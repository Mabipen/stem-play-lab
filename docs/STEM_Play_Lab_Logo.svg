<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>STEM Play Lab Logo - Cosmic Explorer</title>
<desc>STEM Play Lab logo with cosmic explorer concept featuring a planet with ring icon on deep purple background</desc>

<!-- Card background -->
<rect width="600" height="200" rx="24" fill="#F8F0FF"/>

<!-- Star decorations -->
<text x="520" y="40" font-family="system-ui,sans-serif" font-size="18" fill="#D4B2FF" opacity="0.5">✦</text>
<text x="548" y="80" font-family="system-ui,sans-serif" font-size="10" fill="#FF6B9D" opacity="0.4">✦</text>
<text x="530" y="118" font-family="system-ui,sans-serif" font-size="14" fill="#5DCAA5" opacity="0.35">✦</text>
<text x="558" y="32" font-family="system-ui,sans-serif" font-size="8" fill="#FFE566" opacity="0.5">✦</text>
<text x="575" y="55" font-family="system-ui,sans-serif" font-size="12" fill="#D4B2FF" opacity="0.3">✦</text>
<text x="545" y="155" font-family="system-ui,sans-serif" font-size="9" fill="#FF6B9D" opacity="0.3">✦</text>

<!-- Icon background square -->
<rect x="24" y="24" width="152" height="152" rx="32" fill="#3C1A6E"/>
<rect x="32" y="32" width="136" height="136" rx="26" fill="#4A2280"/>

<!-- Small background stars inside icon -->
<circle cx="44" cy="52" r="1.5" fill="white" opacity="0.5"/>
<circle cx="158" cy="44" r="1.5" fill="white" opacity="0.4"/>
<circle cx="150" cy="148" r="1.5" fill="white" opacity="0.5"/>
<circle cx="42" cy="148" r="1.5" fill="white" opacity="0.4"/>
<circle cx="155" cy="96" r="1" fill="white" opacity="0.4"/>
<circle cx="44" cy="100" r="1" fill="white" opacity="0.35"/>

<!-- Planet body -->
<circle cx="100" cy="108" r="34" fill="#FF6B9D"/>

<!-- Planet highlight -->
<circle cx="88" cy="96" r="14" fill="#FF9EBC" opacity="0.45"/>

<!-- Planet ring (behind) -->
<ellipse cx="100" cy="108" rx="50" ry="14" fill="none" stroke="#FFE566" stroke-width="4" opacity="0.9"/>

<!-- Planet front mask (covers ring in front) -->
<path d="M68 108 Q68 74 100 74 Q132 74 132 108" fill="#FF6B9D"/>
<path d="M68 108 Q68 74 100 74 Q132 74 132 108" fill="#4A2280" opacity="0.12"/>

<!-- Small moon top left -->
<circle cx="54" cy="66" r="8" fill="#5DCAA5"/>
<circle cx="54" cy="66" r="3.5" fill="#4A2280"/>

<!-- Small moon bottom right -->
<circle cx="148" cy="148" r="7" fill="#D4B2FF"/>
<circle cx="148" cy="148" r="3" fill="#4A2280"/>

<!-- Star dots -->
<circle cx="52" cy="112" r="2.5" fill="#FFE566"/>
<circle cx="152" cy="72" r="2.5" fill="#FFE566"/>
<circle cx="144" cy="88" r="2" fill="white" opacity="0.7"/>
<circle cx="58" cy="142" r="2" fill="white" opacity="0.65"/>
<circle cx="148" cy="118" r="1.5" fill="#5DCAA5" opacity="0.8"/>
<circle cx="56" cy="82" r="1.5" fill="#D4B2FF" opacity="0.7"/>

<!-- WORDMARK -->
<!-- STEM in deep purple -->
<text x="196" y="92" font-family="Arial Black, system-ui, sans-serif" font-size="58" font-weight="900" fill="#3C1A6E" letter-spacing="-2">STEM</text>

<!-- Play Lab in hot pink -->
<text x="196" y="148" font-family="Arial Black, system-ui, sans-serif" font-size="50" font-weight="900" fill="#FF6B9D" letter-spacing="-1">Play Lab</text>

<!-- Strapline -->
<rect x="196" y="158" width="340" height="1.5" rx="1" fill="#D4B2FF" opacity="0.5"/>
<text x="196" y="176" font-family="Arial, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9B7EC8" letter-spacing="2.5">WHERE IMAGINATION MEETS INNOVATION</text>

</svg>
